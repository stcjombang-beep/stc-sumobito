<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1527">
<title>STC SUMOBITO</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .entry-shell{width:min(420px,100%);background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;box-shadow:0 12px 35px rgba(0,0,0,.35);text-align:center;}
  .entry-shell h1{font-size:20px;color:#38bdf8;margin-bottom:8px;}
  .entry-shell p{font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:18px;}
  .entry-actions{display:grid;gap:10px;}
  .entry-actions a{display:block;text-decoration:none;padding:13px;border-radius:10px;font-weight:800;color:#fff;background:#048760;border:1px solid rgba(255,255,255,.12);}
  .entry-actions a.owner{background:#7c3aed;}
  .entry-note{margin-top:15px;font-size:10px;color:#94a3b8;}
  #routerStatus{font-size:11px;color:#94a3b8;margin-bottom:12px;}
</style>
</head>
<body>
<div class="entry-shell">
  <div style="font-size:42px;margin-bottom:8px">🏬</div>
  <h1>STC SUMOBITO</h1>
  <p>Sistem Informasi STC Sumobito<br>Silakan pilih pintu masuk sesuai hak akses.</p>
  <div id="routerStatus">Memeriksa sesi...</div>
  <div class="entry-actions" id="entryActions" style="display:none">
    <a href="./cabang/">Masuk sebagai CABANG</a>
    <a href="./owner/" class="owner">Masuk sebagai OWNER</a>
  </div>
  <div class="entry-note">Satu repository GitHub • satu deployment • entry point OWNER dan CABANG terpisah.</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBTQIaSq4tZXKJJDjHhJCCCRjKAXkMXuWo",authDomain:"stc-sumobito.firebaseapp.com",projectId:"stc-sumobito",storageBucket:"stc-sumobito.firebasestorage.app",messagingSenderId:"441800488590",appId:"1:441800488590:web:6aeabc53a8b7429ec27bdf"};
const OWNER_UID='5ZQ0VcSeK6XqaYr3ZVmC60eUcO43';
function showChooser(msg){document.getElementById('routerStatus').textContent=msg;document.getElementById('entryActions').style.display='grid';}
window.addEventListener('load',()=>{
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(error=>console.warn('Service Worker:',error));
  }
  try{
    firebase.initializeApp(firebaseConfig);
    const auth=firebase.auth();
    auth.onAuthStateChanged(async user=>{
      if(!user){showChooser('Tidak ada sesi aktif.');return;}
      if(user.isAnonymous){location.replace('./cabang/');return;}
      try{const t=await user.getIdTokenResult();const p=t.claims&&t.claims.firebase&&t.claims.firebase.sign_in_provider;if(user.uid===OWNER_UID&&p==='password'){location.replace('./owner/');return;}}catch(e){}
      await auth.signOut().catch(()=>{});
      showChooser('Sesi tidak dikenali. Pilih pintu masuk.');
    });
  }catch(e){showChooser('Firebase belum siap. Pilih pintu masuk secara manual.');}
});
</script>
</body>
</html>
